<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupled System Visualization</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1f2328;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1f2328;
    }

    #controls {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 860px;
    }

    .control-panel {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1f2328;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .panel-header .swatch {
      display: inline-block;
      width: 24px;
      height: 3px;
      border-radius: 2px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-row input[type="range"] {
      flex: 1;
      accent-color: #3b82d4;
    }

    .control-row input[type="number"] {
      width: 60px;
      padding: 2px 6px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #1f2328;
      background: #f7f8fa;
    }

    #chart-container {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      width: 100%;
      max-width: 860px;
      overflow: hidden;
    }

    #chart {
      width: 100%;
    }

    #reset-btn {
      display: block;
      margin: 12px auto 0;
      padding: 5px 14px;
      font-size: 0.82rem;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #f7f8fa;
      color: #57606a;
      cursor: pointer;
    }

    #reset-btn:hover {
      background: #e5e7eb;
      color: #1f2328;
    }

    .axis text { font-size: 11px; fill: #57606a; }
    .axis line, .axis path { stroke: #e5e7eb; }
    .axis-label { font-size: 12px; fill: #57606a; }
    .waveform-line {
      fill: none;
      stroke-width: 2;
    }
    .system1-line { stroke: #3b82d4; }
    .system2-line { stroke: #e6882a; }
    #legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      padding: 8px 0 4px;
      font-size: 0.82rem;
      color: #57606a;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zero-line {
      stroke: #e5e7eb;
      stroke-width: 1;
      stroke-dasharray: 4 3;
    }
  </style>
</head>
<body>
  <h1>Coupled System Visualization</h1>

  <div id="controls">

    <!-- System 1 -->
    <div class="control-panel">
      <div class="panel-header">
        <span class="swatch" style="background:#3b82d4;"></span>
        System 1
      </div>
      <div class="control-group">
        <label for="amplitude-slider">Amplitude</label>
        <div class="control-row">
          <input type="range" id="amplitude-slider" min="0.1" max="5" step="0.1" value="1" />
          <input type="number"  id="amplitude-num"   min="0.1" max="5" step="0.1" value="1" />
        </div>
      </div>
      <div class="control-group">
        <label for="rest-slider">Rest Duration</label>
        <div class="control-row">
          <input type="range" id="rest-slider" min="0.1" max="10" step="0.1" value="2" />
          <input type="number"  id="rest-num"   min="0.1" max="10" step="0.1" value="2" />
        </div>
      </div>
      <div class="control-group">
        <label for="rise-slider">Rise Duration</label>
        <div class="control-row">
          <input type="range" id="rise-slider" min="0.1" max="10" step="0.1" value="3" />
          <input type="number"  id="rise-num"   min="0.1" max="10" step="0.1" value="3" />
        </div>
      </div>
      <div class="control-group">
        <label for="recover-slider">Recover Duration</label>
        <div class="control-row">
          <input type="range" id="recover-slider" min="0.1" max="10" step="0.1" value="1" />
          <input type="number"  id="recover-num"   min="0.1" max="10" step="0.1" value="1" />
        </div>
      </div>
    </div>

    <!-- System 2 -->
    <div class="control-panel">
      <div class="panel-header">
        <span class="swatch" style="background:#e6882a;"></span>
        System 2
      </div>
      <div class="control-group">
        <label for="s2-amplitude-slider">Amplitude</label>
        <div class="control-row">
          <input type="range" id="s2-amplitude-slider" min="0.1" max="5" step="0.1" value="1" />
          <input type="number"  id="s2-amplitude-num"   min="0.1" max="5" step="0.1" value="1" />
        </div>
      </div>
      <div class="control-group">
        <label for="s2-rest-slider">Rest Duration</label>
        <div class="control-row">
          <input type="range" id="s2-rest-slider" min="0.1" max="10" step="0.1" value="1" />
          <input type="number"  id="s2-rest-num"   min="0.1" max="10" step="0.1" value="1" />
        </div>
      </div>
      <div class="control-group">
        <label for="s2-rise-slider">Rise Duration</label>
        <div class="control-row">
          <input type="range" id="s2-rise-slider" min="0.1" max="10" step="0.1" value="2" />
          <input type="number"  id="s2-rise-num"   min="0.1" max="10" step="0.1" value="2" />
        </div>
      </div>
      <div class="control-group">
        <label for="s2-recover-slider">Recover Duration</label>
        <div class="control-row">
          <input type="range" id="s2-recover-slider" min="0.1" max="10" step="0.1" value="2" />
          <input type="number"  id="s2-recover-num"   min="0.1" max="10" step="0.1" value="2" />
        </div>
      </div>
    </div>

  </div>

  <div id="chart-container">
    <div id="chart"></div>
    <div id="legend">
      <span class="legend-item">
        <svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#3b82d4" stroke-width="2"/></svg>
        System 1
      </span>
      <span class="legend-item">
        <svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#e6882a" stroke-width="2"/></svg>
        System 2
      </span>
    </div>
    <button id="reset-btn">Reset Zoom</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="viz.js"></script>
</body>
</html>
