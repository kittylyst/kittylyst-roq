{#let y = year.toString}
<details class="group border border-gray-200 rounded-lg mb-2 bg-white shadow-sm open:shadow-md transition-shadow" {#if yearIndex == 0}open{/if}>
    <summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 text-left text-gray-900 hover:bg-gray-50 [&::-webkit-details-marker]:hidden [&::marker]:content-none">
        <span class="text-base font-semibold">{y}</span>
        <svg class="h-5 w-5 shrink-0 text-gray-500 transition-transform group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
    </summary>
    <div class="space-y-1.5 border-t border-gray-100 px-4 pb-4 pt-2">
        {#for item in collection}
        {#if item.data.pubdate?? && item.data.pubdate.toString.startsWith(y)}
        <div class="grid grid-cols-1 items-baseline gap-x-4 gap-y-0.5 sm:grid-cols-[1fr_11rem]">
            <div class="min-w-0">
                <a href="{item.data.url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">{item.title}</a>
            </div>
            <div class="text-right text-sm whitespace-nowrap text-gray-600 sm:pl-2">
                {item.data.pubdate} ({item.data.publisher})
            </div>
        </div>
        {/if}
        {/for}
    </div>
</details>
